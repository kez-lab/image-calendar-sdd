<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Calendar v2 · App Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>* { margin:0; padding:0; box-sizing:border-box; } body { background:#F0EDE8; font-family:'DM Sans',sans-serif; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// ─── Design Tokens ────────────────────────────────────────────────
const T = {
  bg:      '#FAFAF7',
  bg2:     '#F3F0EB',
  bg3:     '#EAE6DF',
  card:    '#FFFFFF',
  border:  '#E8E4DD',
  text:    '#2C2825',
  text2:   '#7A746C',
  text3:   '#B0A99F',
  accent:  '#7C6FC4',
  accentL: '#EAE7F8',
  warm:    '#C8815A',
  warmL:   '#F5EBE4',
  teal:    '#5A9EA0',
  tealL:   '#E4F2F2',
  good:    '#6BAE8C',
  goodL:   '#E4F2EB',
  danger:  '#D94F3D',
  dangerL: '#FDECEA',
};

// ─── Icons ───────────────────────────────────────────────────────
const Icon = ({ name, size = 20, color = T.text2 }) => {
  const s = { width: size, height: size, display: 'block', flexShrink: 0 };
  const paths = {
    calendar:  <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
    plus:      <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
    archive:   <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="5" rx="1"/><path d="M4 9v10a1 1 0 001 1h14a1 1 0 001-1V9"/><line x1="9" y1="13" x2="15" y2="13"/></svg>,
    settings:  <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>,
    chevLeft:  <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>,
    chevRight: <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>,
    search:    <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.7" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
    camera:    <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>,
    image:     <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>,
    lock:      <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>,
    edit:      <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
    trash:     <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>,
    download:  <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
    info:      <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
    check:     <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
    back:      <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
    warn:      <svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
  };
  return paths[name] || null;
};

// ─── Image Placeholder ───────────────────────────────────────────
const ImgPlaceholder = ({ w, h, label = '', style = {}, tone = 'warm' }) => {
  const tones = {
    warm:    { bg: '#E8D5C8', stripe: '#D4BFB0', text: '#A08070' },
    cool:    { bg: '#C8D5E8', stripe: '#B0C0D4', text: '#607090' },
    sage:    { bg: '#C8D8C8', stripe: '#B0C8B0', text: '#607060' },
    lavender:{ bg: '#D5C8E8', stripe: '#C0B0D4', text: '#706090' },
    peach:   { bg: '#E8D0C0', stripe: '#D4BAA8', text: '#A07060' },
  };
  const c = tones[tone] || tones.warm;
  const sw = 10;
  const numW = typeof w === 'number' ? w : 300;
  return (
    <div style={{ width: w, height: h, borderRadius: 10, overflow: 'hidden', position: 'relative', flexShrink: 0, background: c.bg, ...style }}>
      <svg width={numW} height={h} style={{ position: 'absolute', top: 0, left: 0 }}>
        {Array.from({ length: Math.ceil(numW / sw) * 2 }).map((_, i) => (
          <line key={i} x1={i * sw - h} y1={0} x2={i * sw} y2={h} stroke={c.stripe} strokeWidth="1" opacity="0.5" />
        ))}
      </svg>
      {label && (
        <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, color: c.text, fontFamily: 'monospace', textAlign: 'center', padding: 4, lineHeight: 1.4 }}>{label}</div>
      )}
    </div>
  );
};

// ─── Local Badge ─────────────────────────────────────────────────
const LocalBadge = () => (
  <div style={{ display: 'inline-flex', alignItems: 'center', gap: 4, background: T.goodL, border: `1px solid ${T.good}33`, borderRadius: 20, padding: '4px 10px' }}>
    <Icon name="lock" size={11} color={T.good} />
    <span style={{ fontSize: 10, color: T.good, fontWeight: 500 }}>내 폰에만 저장됨</span>
  </div>
);

// ─── Tab Bar ────────────────────────────────────────────────────
const TabBar = ({ active = 'calendar' }) => {
  const tabs = [
    { id: 'calendar', label: '캘린더' },
    { id: 'plus',     label: '추가' },
    { id: 'archive',  label: '아카이브' },
    { id: 'settings', label: '설정' },
  ];
  return (
    <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, background: 'rgba(250,250,247,0.96)', backdropFilter: 'blur(12px)', borderTop: `1px solid ${T.border}`, display: 'flex', alignItems: 'center', paddingBottom: 20, paddingTop: 10 }}>
      {tabs.map(t => {
        const isActive = t.id === active;
        const color = isActive ? T.accent : T.text3;
        return (
          <div key={t.id} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
            {t.id === 'plus' ? (
              <div style={{ width: 46, height: 46, borderRadius: 23, background: T.accent, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: `0 4px 14px ${T.accent}55`, marginTop: -20 }}>
                <Icon name="plus" size={22} color="#fff" />
              </div>
            ) : (
              <>
                <Icon name={t.id} size={22} color={color} />
                <span style={{ fontSize: 10, color, fontWeight: isActive ? 500 : 400 }}>{t.label}</span>
              </>
            )}
          </div>
        );
      })}
    </div>
  );
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Screen 1 — Onboarding (v2: CTA copy updated)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const OnboardingScreen = () => (
  <div style={{ width: '100%', height: '100%', background: T.bg, display: 'flex', flexDirection: 'column', alignItems: 'center', position: 'relative' }}>
    {/* Progress dots */}
    <div style={{ position: 'absolute', top: 60, left: 0, right: 0, display: 'flex', justifyContent: 'center', gap: 6 }}>
      {[0,1,2].map(i => (
        <div key={i} style={{ width: i === 2 ? 20 : 6, height: 6, borderRadius: 3, background: i === 2 ? T.accent : T.border }} />
      ))}
    </div>

    {/* Illustration */}
    <div style={{ marginTop: 90, position: 'relative' }}>
      <ImgPlaceholder w={220} h={240} label="illustr.\n기기 안의 기록" tone="sage" style={{ borderRadius: 24 }} />
      <div style={{ position: 'absolute', bottom: -14, right: -14, width: 44, height: 44, borderRadius: 22, background: T.good, boxShadow: '0 4px 12px #6BAE8C44', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <Icon name="lock" size={20} color="#fff" />
      </div>
    </div>

    {/* Text */}
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '0 36px', textAlign: 'center', marginTop: 28 }}>
      <h2 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 26, lineHeight: 1.3, color: T.text, whiteSpace: 'pre-line', marginBottom: 14 }}>{'내 폰 안에만 쌓이는\n하루 사진 캘린더'}</h2>
      <p style={{ fontSize: 14, color: T.text2, lineHeight: 1.7 }}>계정 없이 사용할 수 있어요.<br/>이 기기에만 저장돼요.</p>
      <div style={{ marginTop: 20 }}><LocalBadge /></div>
    </div>

    {/* CTA — v2 updated */}
    <div style={{ padding: '0 28px 50px', width: '100%', display: 'flex', flexDirection: 'column', gap: 12 }}>
      <button style={{ width: '100%', height: 52, borderRadius: 16, background: T.accent, border: 'none', color: '#fff', fontSize: 16, fontWeight: 600, fontFamily: 'inherit', boxShadow: `0 6px 20px ${T.accent}44`, cursor: 'pointer' }}>
        첫 기록 만들기
      </button>
      <button style={{ background: 'none', border: 'none', fontSize: 13, color: T.text3, fontFamily: 'inherit', cursor: 'pointer', padding: '6px 0' }}>
        건너뛰고 캘린더 보기
      </button>
    </div>
  </div>
);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Screen 2 — Home Calendar (v2: dots/mini-stack instead of thumbnails)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const CalendarScreen = () => {
  const days = ['일','월','화','수','목','금','토'];
  const today = 27;
  const startDay = 3;
  const totalDays = 30;
  // counts per day: some have multiple photos
  const entryCounts = { 3:1, 7:2, 10:1, 12:3, 15:1, 18:2, 21:1, 22:1, 24:2, 27:3 };
  const tones = { 3:'warm', 7:'cool', 10:'sage', 12:'peach', 15:'lavender', 18:'warm', 21:'cool', 22:'sage', 24:'peach', 27:'warm' };

  const cells = [];
  for (let i = 0; i < startDay; i++) cells.push(null);
  for (let d = 1; d <= totalDays; d++) cells.push(d);

  // Dot marker: shows up to 3 dots for entry count
  const DotMarker = ({ count, isToday }) => (
    <div style={{ display: 'flex', gap: 2, justifyContent: 'center', marginTop: 2 }}>
      {Array.from({ length: Math.min(count, 3) }).map((_, i) => (
        <div key={i} style={{ width: 4, height: 4, borderRadius: 2, background: isToday ? T.accent : T.warm, opacity: i === 2 && count > 3 ? 0.5 : 1 }} />
      ))}
    </div>
  );

  return (
    <div style={{ width: '100%', height: '100%', background: T.bg, display: 'flex', flexDirection: 'column' }}>
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '56px 20px 10px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
          <button style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4 }}><Icon name="chevLeft" size={20} color={T.text2} /></button>
          <span style={{ fontFamily: "'DM Serif Display', serif", fontSize: 20, color: T.text }}>2026년 4월</span>
          <button style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4 }}><Icon name="chevRight" size={20} color={T.text2} /></button>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button style={{ background: 'none', border: 'none', cursor: 'pointer' }}><Icon name="search" size={20} color={T.text2} /></button>
        </div>
      </div>

      <div style={{ paddingLeft: 20, paddingBottom: 8 }}><LocalBadge /></div>

      {/* Day headers */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', padding: '0 10px', marginBottom: 4 }}>
        {days.map((d, i) => (
          <div key={d} style={{ textAlign: 'center', fontSize: 11, color: i === 0 ? '#E57373' : i === 6 ? T.accent : T.text3, fontWeight: 500, padding: '4px 0' }}>{d}</div>
        ))}
      </div>

      {/* Calendar grid — v2: dots, not thumbnails */}
      <div style={{ flex: 1, padding: '0 10px', overflowY: 'auto' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '2px' }}>
          {cells.map((d, i) => {
            if (!d) return <div key={`e${i}`} style={{ aspectRatio: '1', minHeight: 44 }} />;
            const isToday = d === today;
            const count = entryCounts[d] || 0;
            const isSun = (i % 7) === 0;
            const isSat = (i % 7) === 6;
            return (
              <div key={d} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: 50, borderRadius: 12, padding: '6px 2px', background: isToday ? T.accentL : 'transparent', position: 'relative' }}>
                <span style={{ fontSize: 14, fontWeight: isToday ? 700 : count > 0 ? 500 : 400, color: isToday ? T.accent : isSun ? '#E57373' : isSat ? '#9B8FE0' : T.text, lineHeight: 1 }}>{d}</span>
                {count > 0 && <DotMarker count={count} isToday={isToday} />}
              </div>
            );
          })}
        </div>

        {/* Today preview strip */}
        <div style={{ margin: '14px 0 90px', background: T.card, borderRadius: 16, padding: 14, boxShadow: '0 2px 12px #00000008', border: `1px solid ${T.border}` }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
            <div>
              <span style={{ fontSize: 13, fontWeight: 600, color: T.text }}>오늘 · 4월 27일</span>
              <span style={{ fontSize: 11, color: T.text3, marginLeft: 8 }}>기록 3개</span>
            </div>
            <span style={{ fontSize: 11, color: T.accent }}>모두 보기 →</span>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            {['warm','cool','sage'].map((t, i) => (
              <ImgPlaceholder key={i} w={72} h={72} tone={t} style={{ borderRadius: 12, flexShrink: 0 }} />
            ))}
            <div style={{ width: 72, height: 72, borderRadius: 12, border: `1.5px dashed ${T.border}`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <Icon name="plus" size={18} color={T.text3} />
            </div>
          </div>
        </div>
      </div>

      <TabBar active="calendar" />
    </div>
  );
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Screen 3 — Date Detail (unchanged structure, thumbnails central)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const DetailScreen = () => {
  const records = [
    { time: '07:42', memo: '아침 산책 중에 발견한 벚꽃 골목. 오늘도 여기서 하루를 시작했다.', emotion: '😌 평온', tone: 'sage' },
    { time: '12:30', memo: '동네 카페에서 혼자 점심. 오늘의 라떼는 유독 맛있었다 ☕', emotion: '😊 행복', tone: 'warm' },
    { time: '19:58', memo: '저녁 노을이 너무 예뻐서 그냥 찍었다.', emotion: '🥰 감사', tone: 'peach' },
  ];

  const emotionStyle = { '😌 평온': { bg: T.tealL, color: T.teal }, '😊 행복': { bg: '#FFF8E1', color: '#F59E0B' }, '🥰 감사': { bg: T.warmL, color: T.warm } };

  return (
    <div style={{ width: '100%', height: '100%', background: T.bg2, display: 'flex', flexDirection: 'column' }}>
      <div style={{ background: T.bg, display: 'flex', alignItems: 'center', padding: '52px 20px 14px', gap: 12, boxShadow: '0 1px 0 #E8E4DD' }}>
        <button style={{ background: 'none', border: 'none', cursor: 'pointer' }}><Icon name="back" size={22} color={T.text} /></button>
