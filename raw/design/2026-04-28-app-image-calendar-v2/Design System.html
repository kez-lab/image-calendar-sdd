<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Calendar · Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body { background:#F3F0EB; font-family:'DM Sans',sans-serif; color:#2C2825; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const DS = {
  bg:       '#FAFAF7',
  bg2:      '#F3F0EB',
  bg3:      '#EAE6DF',
  card:     '#FFFFFF',
  border:   '#E8E4DD',
  text:     '#2C2825',
  text2:    '#7A746C',
  text3:    '#B0A99F',
  accent:   '#7C6FC4',
  accentL:  '#EAE7F8',
  warm:     '#C8815A',
  warmL:    '#F5EBE4',
  teal:     '#5A9EA0',
  tealL:    '#E4F2F2',
  good:     '#6BAE8C',
  goodL:    '#E4F2EB',
  danger:   '#D94F3D',
  dangerL:  '#FDECEA',
  disabled: '#D8D3CC',
  disabledBg:'#F0EDE8',
};

// ─── Nav Sidebar ────────────────────────────────────────────────
const sections = [
  { id: 'colors',     label: '색상 토큰' },
  { id: 'typography', label: '타이포그래피' },
  { id: 'spacing',    label: '간격 · 반경' },
  { id: 'components', label: '컴포넌트' },
  { id: 'states',     label: '상태' },
  { id: 'a11y',       label: '접근성' },
  { id: 'changelog',  label: '변경 요약' },
];

const Sidebar = ({ active, setActive }) => (
  <nav style={{ width: 200, flexShrink: 0, position: 'sticky', top: 0, height: '100vh', overflowY: 'auto', background: DS.card, borderRight: `1px solid ${DS.border}`, padding: '32px 0' }}>
    <div style={{ padding: '0 20px 24px', borderBottom: `1px solid ${DS.border}`, marginBottom: 16 }}>
      <div style={{ fontFamily: "'DM Serif Display', serif", fontSize: 15, color: DS.text, lineHeight: 1.3 }}>Image Calendar</div>
      <div style={{ fontSize: 11, color: DS.text3, marginTop: 2 }}>Design System · v2</div>
    </div>
    {sections.map(s => (
      <button key={s.id} onClick={() => setActive(s.id)} style={{ display: 'block', width: '100%', textAlign: 'left', padding: '9px 20px', fontSize: 13, fontWeight: active === s.id ? 600 : 400, color: active === s.id ? DS.accent : DS.text2, background: active === s.id ? DS.accentL : 'none', border: 'none', cursor: 'pointer', fontFamily: 'inherit', borderLeft: active === s.id ? `3px solid ${DS.accent}` : '3px solid transparent' }}>
        {s.label}
      </button>
    ))}
  </nav>
);

// ─── Section wrapper ─────────────────────────────────────────────
const Section = ({ title, sub, children }) => (
  <div style={{ marginBottom: 56 }}>
    <div style={{ marginBottom: 24 }}>
      <h2 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 26, color: DS.text }}>{title}</h2>
      {sub && <p style={{ fontSize: 13, color: DS.text2, marginTop: 6, lineHeight: 1.6 }}>{sub}</p>}
    </div>
    {children}
  </div>
);

const SubSection = ({ title, children }) => (
  <div style={{ marginBottom: 32 }}>
    <div style={{ fontSize: 11, fontWeight: 600, color: DS.text3, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 14, paddingBottom: 8, borderBottom: `1px solid ${DS.border}` }}>{title}</div>
    {children}
  </div>
);

const Code = ({ children }) => (
  <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, background: DS.bg2, padding: '2px 6px', borderRadius: 4, color: DS.warm }}>{children}</span>
);

// ─── Color Token Row ────────────────────────────────────────────
const ColorRow = ({ name, hex, usage, role }) => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '10px 0', borderBottom: `1px solid ${DS.border}` }}>
    <div style={{ width: 40, height: 40, borderRadius: 10, background: hex, flexShrink: 0, border: `1px solid #00000012` }} />
    <div style={{ flex: 1 }}>
      <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
        <Code>{name}</Code>
        <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, color: DS.text3 }}>{hex}</span>
        {role && <span style={{ fontSize: 10, background: DS.accentL, color: DS.accent, borderRadius: 10, padding: '2px 8px', fontWeight: 600 }}>{role}</span>}
      </div>
      <div style={{ fontSize: 12, color: DS.text2, marginTop: 4 }}>{usage}</div>
    </div>
  </div>
);

// ─── Color Palette ────────────────────────────────────────────
const ColorsSection = () => {
  const tokens = [
    { name: '--color-bg',          hex: '#FAFAF7', usage: '기본 화면 배경, 카드 외부 영역', role: 'Background' },
    { name: '--color-bg2',         hex: '#F3F0EB', usage: '보조 배경, 입력 필드, 비활성 탭 배경' },
    { name: '--color-bg3',         hex: '#EAE6DF', usage: '강조 구분선, hover state, disabled 배경' },
    { name: '--color-card',        hex: '#FFFFFF', usage: '카드 컴포넌트, 모달, Bottom Sheet 배경', role: 'Card' },
    { name: '--color-border',      hex: '#E8E4DD', usage: '구분선, 카드 테두리, 입력 필드 테두리', role: 'Border' },
    { name: '--color-text',        hex: '#2C2825', usage: '주요 텍스트 — 제목, 강조 본문', role: 'Text Primary' },
    { name: '--color-text2',       hex: '#7A746C', usage: '보조 텍스트 — 설명, 서브라벨' },
    { name: '--color-text3',       hex: '#B0A99F', usage: '비활성/힌트 텍스트, placeholder, muted 레이블' },
    { name: '--color-accent',      hex: '#7C6FC4', usage: '주요 액션 버튼, 탭 활성, 포커스, 선택 상태', role: 'Accent' },
    { name: '--color-accent-light',hex: '#EAE7F8', usage: '액센트 버튼 배경(약), 선택된 칩 배경, 배지' },
    { name: '--color-good',        hex: '#6BAE8C', usage: '로컬 저장 배지, 신뢰 카드, 저장 성공 상태', role: 'Local-safe' },
    { name: '--color-good-light',  hex: '#E4F2EB', usage: '로컬 저장 배지 배경, 신뢰 카드 배경' },
    { name: '--color-danger',      hex: '#D94F3D', usage: '삭제 버튼, 위험 영역 텍스트, 에러 상태', role: 'Danger' },
    { name: '--color-danger-light',hex: '#FDECEA', usage: '위험 영역 배경, 삭제 확인 모달 배경' },
    { name: '--color-disabled',    hex: '#D8D3CC', usage: '비활성 버튼 텍스트, 비활성 아이콘' },
    { name: '--color-disabled-bg', hex: '#F0EDE8', usage: '비활성 버튼 배경' },
    { name: '--color-warm',        hex: '#C8815A', usage: '캘린더 날짜 마커 점, 사진 기록 accent warm', role: 'Warm' },
    { name: '--color-warm-light',  hex: '#F5EBE4', usage: '감사 감정 칩 배경' },
    { name: '--color-teal',        hex: '#5A9EA0', usage: '평온 감정 칩 텍스트' },
    { name: '--color-teal-light',  hex: '#E4F2F2', usage: '평온 감정 칩 배경' },
  ];
  return (
    <Section title="색상 토큰" sub="모든 토큰은 CSS 커스텀 프로퍼티로 관리하며, 라이트 모드 단일 팔레트로 운영합니다.">
      <SubSection title="전체 팔레트">
        {tokens.map(t => <ColorRow key={t.name} {...t} />)}
      </SubSection>
      <SubSection title="사용 예시 코드">
        <div style={{ background: DS.bg2, borderRadius: 12, padding: 16, fontFamily: "'DM Mono', monospace", fontSize: 12, color: DS.text2, lineHeight: 2 }}>
          <span style={{ color: DS.text3 }}>/* 주요 버튼 */</span><br/>
          background: <span style={{ color: DS.accent }}>var(--color-accent)</span>;<br/>
          color: <span style={{ color: DS.accent }}>#ffffff</span>;<br/><br/>
          <span style={{ color: DS.text3 }}>/* 로컬 저장 배지 */</span><br/>
          background: <span style={{ color: DS.good }}>var(--color-good-light)</span>;<br/>
          color: <span style={{ color: DS.good }}>var(--color-good)</span>;<br/><br/>
          <span style={{ color: DS.text3 }}>/* 위험 버튼 */</span><br/>
          background: <span style={{ color: DS.danger }}>var(--color-danger)</span>;<br/>
          color: <span style={{ color: DS.danger }}>#ffffff</span>;
        </div>
      </SubSection>
    </Section>
  );
};

// ─── Typography ──────────────────────────────────────────────────
const TypographySection = () => {
  const scale = [
    { name: 'Display', font: 'DM Serif Display', size: 28, weight: 400, lh: 1.25, usage: '온보딩 헤드라인', italic: true },
    { name: 'Title L',  font: 'DM Serif Display', size: 22, weight: 400, lh: 1.3, usage: '월 제목, 섹션 헤더' },
    { name: 'Title M',  font: 'DM Serif Display', size: 18, weight: 400, lh: 1.35, usage: '날짜 헤더' },
    { name: 'Body L',   font: 'DM Sans', size: 16, weight: 400, lh: 1.6, usage: '버튼 레이블, 입력 값' },
    { name: 'Body M',   font: 'DM Sans', size: 14, weight: 400, lh: 1.65, usage: '카드 본문, 설정 항목, 메모' },
    { name: 'Body S',   font: 'DM Sans', size: 13, weight: 400, lh: 1.7, usage: '보조 설명, 감정 칩' },
    { name: 'Label',    font: 'DM Sans', size: 12, weight: 600, lh: 1.4, usage: '섹션 레이블 (uppercase)', mono: false },
    { name: 'Caption',  font: 'DM Sans', size: 11, weight: 400, lh: 1.5, usage: '타임스탬프, 메타, 카운트' },
    { name: 'Micro',    font: 'DM Sans', size: 10, weight: 500, lh: 1.4, usage: '탭 바 레이블, 배지 텍스트' },
    { name: 'Mono',     font: 'DM Mono', size: 11, weight: 400, lh: 1.6, usage: '색상 값, 코드, 토큰 표시' },
  ];

  return (
    <Section title="타이포그래피" sub="제목계는 DM Serif Display, 본문계는 DM Sans, 토큰/코드는 DM Mono를 사용합니다.">
      <SubSection title="타입 스케일">
        <div style={{ background: DS.card, borderRadius: 16, border: `1px solid ${DS.border}`, overflow: 'hidden' }}>
          {scale.map((s, i) => (
            <div key={s.name} style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '14px 20px', borderBottom: i < scale.length - 1 ? `1px solid ${DS.border}` : 'none' }}>
              <div style={{ width: 76, flexShrink: 0 }}>
                <Code>{s.name}</Code>
              </div>
              <div style={{ flex: 1, fontFamily: `'${s.font}', ${s.font === 'DM Mono' ? 'monospace' : 'sans-serif'}`, fontSize: s.size, fontWeight: s.weight, lineHeight: s.lh, color: DS.text, fontStyle: s.italic ? 'italic' : 'normal' }}>
                가나다 ABC 123
              </div>
              <div style={{ width: 200, flexShrink: 0 }}>
                <div style={{ fontSize: 11, color: DS.text3, fontFamily: "'DM Mono', monospace" }}>{s.size}px · {s.weight} · lh {s.lh}</div>
                <div style={{ fontSize: 11, color: DS.text2, marginTop: 2 }}>{s.usage}</div>
              </div>
            </div>
          ))}
        </div>
      </SubSection>

      <SubSection title="Android 대체 폰트">
        <div style={{ background: DS.bg2, borderRadius: 12, padding: '14px 18px', fontSize: 13, color: DS.text2, lineHeight: 1.8 }}>
          <div style={{ fontWeight: 600, color: DS.text, marginBottom: 6 }}>권장 방식</div>
          DM Serif Display → <Code>Noto Serif KR</Code> (weight 400) — 한글 세리프 계열<br/>
          DM Sans → <Code>Pretendard</Code> 또는 <Code>Noto Sans KR</Code> — 모든 weight 지원<br/>
          DM Mono → <Code>JetBrains Mono</Code> 또는 <Code>Noto Sans Mono</Code><br/>
          <div style={{ marginTop: 10, fontSize: 12, color: DS.text3 }}>Android에서는 Google Fonts 동적 로딩 또는 앱 번들 내 폰트 임베드를 권장합니다.</div>
        </div>
      </SubSection>
    </Section>
  );
};

// ─── Spacing & Radius ────────────────────────────────────────────
const SpacingSection = () => {
  const spacingScale = [
    { token: '--sp-1', px: 4,  usage: '아이콘 내부 gap, 마이크로 간격' },
    { token: '--sp-2', px: 8,  usage: '칩 내부 패딩, 아이콘↔텍스트 gap' },
    { token: '--sp-3', px: 12, usage: '카드 내부 패딩 (소형), 섹션 gap' },
    { token: '--sp-4', px: 16, usage: '카드 패딩, 설정 row 패딩 (수평)' },
    { token: '--sp-5', px: 20, usage: '화면 수평 패딩 (기본)', role: '기준' },
    { token: '--sp-6', px: 24, usage: '모달 패딩, 큰 섹션 간격' },
    { token: '--sp-7', px: 28, usage: 'CTA 영역 수평 패딩' },
    { token: '--sp-8', px: 32, usage: '온보딩 여백, 대형 섹션 분리' },
  ];
  const radii = [
    { token: '--r-chip',   px: 20, usage: '감정 칩, 필터 버튼, 배지' },
    { token: '--r-btn',    px: 16, usage: '주요 CTA 버튼' },
    { token: '--r-btn-sm', px: 20, usage: '소형 버튼 (pill 형태)' },
    { token: '--r-card',   px: 16, usage: '일반 카드, 설정 그룹' },
    { token: '--r-card-lg',px: 18, usage: '기록 카드 (사진 포함)' },
    { token: '--r-img',    px: 12, usage: '아카이브 썸네일, 미리보기 이미지' },
    { token: '--r-img-sm', px: 8,  usage: '캘린더 날짜 셀 내 이미지' },
    { token: '--r-modal',  px: 24, usage: 'Bottom Sheet, 삭제 모달 (top only)' },
    { token: '--r-input',  px: 12, usage: '텍스트 입력 필드' },
    { token: '--r-icon',   px: 10, usage: '설정 row 아이콘 컨테이너' },
  ];
  return (
    <Section title="간격 · 반경" sub="8pt 기반 간격 시스템. 화면 수평 패딩은 20px(--sp-5)를 기본으로 합니다.">
      <SubSection title="Spacing Scale">
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 12 }}>
          {spacingScale.map(s => (
            <div key={s.token} style={{ background: DS.card, border: `1px solid ${DS.border}`, borderRadius: 12, padding: '12px 16px', minWidth: 160 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                <div style={{ height: 6, background: s.role ? DS.accent : DS.warm, borderRadius: 3, width: s.px * 2 }} />
              </div>
              <Code>{s.token}</Code>
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 13, color: DS.text, marginTop: 4, fontWeight: 600 }}>{s.px}px</div>
              <div style={{ fontSize: 11, color: DS.text3, marginTop: 4, lineHeight: 1.4 }}>{s.usage}</div>
            </div>
          ))}
        </div>
      </SubSection>
      <SubSection title="Border Radius Scale">
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 12 }}>
          {radii.map(r => (
            <div key={r.token} style={{ background: DS.card, border: `1px solid ${DS.border}`, borderRadius: 12, padding: '12px 16px', minWidth: 160 }}>
              <div style={{ width: 40, height: 40, background: DS.accentL, borderRadius: Math.min(r.px, 20), marginBottom: 8 }} />
              <Code>{r.token}</Code>
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 13, color: DS.text, marginTop: 4, fontWeight: 600 }}>{r.px}px</div>
              <div style={{ fontSize: 11, color: DS.text3, marginTop: 4, lineHeight: 1.4 }}>{r.usage}</div>
            </div>
          ))}
        </div>
      </SubSection>
    </Section>
  );
};

// ─── Components ──────────────────────────────────────────────────
const Chip = ({ label }) => (
  <div style={{ display: 'inline-flex', alignItems: 'center', gap: 4, background: DS.goodL, border: `1px solid ${DS.good}33`, borderRadius: 20, padding: '4px 10px' }}>
    <span style={{ fontSize: 10, color: DS.good, fontWeight: 500 }}>🔒 {label}</span>
  </div>
);

const ComponentsSection = () => {
  // Emotion chip states
  const emotionStates = [
    { label: '😊 행복', state: 'default', bg: DS.bg2, color: DS.text2, border: 'transparent' },
    { label: '😊 행복', state: 'selected', bg: DS.accentL, color: DS.accent, border: DS.accent },
    { label: '😊 행복', state: 'disabled', bg: DS.bg3, color: DS.disabled, border: 'transparent' },
  ];

  // Date marker types
  const markerTypes = [
    { label: '기록 없음', node: <div style={{ width: 44, height: 50, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', borderRadius: 12 }}><span style={{ fontSize: 14, color: DS.text }}>14</span></div> },
    { label: '기록 1개', node: <div style={{ width: 44, height: 50, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', borderRadius: 12, gap: 4 }}><span style={{ fontSize: 14, color: DS.text, fontWeight: 500 }}>15</span><div style={{ display: 'flex', gap: 2 }}><div style={{ width: 4, height: 4, borderRadius: 2, background: DS.warm }} /></div></div> },
    { label: '기록 3개', node: <div style={{ width: 44, height: 50, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', borderRadius: 12, gap: 4 }}><span style={{ fontSize: 14, color: DS.text, fontWeight: 500 }}>16</span><div style={{ display: 'flex', gap: 2 }}>{[0,1,2].map(i => <div key={i} style={{ width: 4, height: 4, borderRadius: 2, background: DS.warm }} />)}</div></div> },
    { label: '오늘 (기록 있음)', node: <div style={{ width: 44, height: 50, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', borderRadius: 12, gap: 4, background: DS.accentL }}><span style={{ fontSize: 14, color: DS.accent, fontWeight: 700 }}>27</span><div style={{ display: 'flex', gap: 2 }}>{[0,1,2].map(i => <div key={i} style={{ width: 4, height: 4, borderRadius: 2, background: DS.accent }} />)}</div></div> },
    { label: '오늘 (기록 없음)', node: <div style={{ width: 44, height: 50, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', borderRadius: 12, gap: 4, background: DS.accentL }}><span style={{ fontSize: 14, color: DS.accent, fontWeight: 700 }}>28</span><div style={{ width: 4, height: 4, borderRadius: 2, background: DS.accentL }} /></div> },
  ];

  const ComponentCard = ({ title, desc, children, rule }) => (
    <div style={{ background: DS.card, border: `1px solid ${DS.border}`, borderRadius: 16, overflow: 'hidden', marginBottom: 16 }}>
      <div style={{ padding: '14px 18px', borderBottom: `1px solid ${DS.border}`, display: 'flex', alignItems: 'baseline', gap: 10 }}>
        <span style={{ fontSize: 13, fontWeight: 600, color: DS.text }}>{title}</span>
        {desc && <span style={{ fontSize: 11, color: DS.text3 }}>{desc}</span>}
      </div>
      <div style={{ padding: '18px 18px' }}>
        {children}
        {rule && <div style={{ marginTop: 14, paddingTop: 12, borderTop: `1px solid ${DS.border}`, fontSize: 12, color: DS.text2, lineHeight: 1.6 }}><span style={{ fontWeight: 600 }}>규칙: </span>{rule}</div>}
      </div>
